# git-cliff configuration — feeds scripts/generate-release-notes.sh.
# Conventional-Commits-ish grouping matching the house commit style.

[changelog]
header = """
# Changelog\n
All notable changes to Phantom.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | split(pat="\n") | first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Commit subjects are history and cannot be rewritten; the generated changelog
# is public. One subject names a third-party product as the 8768 port squatter;
# the public sweep forbids that vendor's name, so match the two-word product
# name by shape rather than spelling it here.
commit_preprocessors = [
  { pattern = "[A-Z][a-z]+ [A-Z][a-z]+ squatted on 8768", replace = "another vendor's agent squatted on 8768" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^security", group = "<!-- 2 -->Security" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^refactor|^perf|^style", group = "<!-- 4 -->Changed" },
  { message = "^test|^chore|^build|^bd|^wip", skip = true },
  # release.sh's own commit and merge commits are plumbing, not changes.
  { message = "^release|^Merge ", skip = true },
  { message = ".*", group = "<!-- 5 -->Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "newest"
